
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.4"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.3"
            laravel: "13.*"
            testbench: "11.*"
          - php: "8.4"
            laravel: "13.*"
            testbench: "11.*"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Resolve matrix dependencies
        run: composer update --no-interaction --prefer-dist --with-all-dependencies "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"

      - name: Audit resolved dependencies
        run: composer audit

      - name: Generate optimized autoload files
        run: composer dump-autoload --optimize

      - name: Run package tests
        run: vendor/bin/phpunit

  clean-install:
    name: Clean Laravel 12 install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Create a fresh Laravel application
        run: composer create-project laravel/laravel:^12.0 /tmp/schedule-audit-app --no-interaction --prefer-dist

      - name: Install the package with normal Composer scripts
        working-directory: /tmp/schedule-audit-app
        run: |
          composer config repositories.schedule-audit '{"type":"path","url":"${{ github.workspace }}","options":{"symlink":false}}'
          composer require --dev asfiaaiman/laravel-schedule-audit:@dev --no-interaction --prefer-dist

      - name: Verify package discovery
        working-directory: /tmp/schedule-audit-app
        run: php artisan package:discover --ansi

      - name: Diagnose provider and command autoloading
        working-directory: /tmp/schedule-audit-app
        run: |
          php -r "require 'vendor/autoload.php'; var_dump(class_exists('AsfiaAiman\\LaravelScheduleAudit\\LaravelScheduleAuditServiceProvider'));"
          php -r "require 'vendor/autoload.php'; var_dump(class_exists('AsfiaAiman\\LaravelScheduleAudit\\Commands\\ScheduleAuditCommand'));"
          grep -n 'LaravelScheduleAuditServiceProvider' bootstrap/cache/packages.php || true

      - name: Verify command registration
        working-directory: /tmp/schedule-audit-app
        run: php artisan list --raw | grep '^schedule:audit$'

      - name: Verify clean audit output
        working-directory: /tmp/schedule-audit-app
        run: |
          output="$(php artisan schedule:audit --no-ansi)"
          printf 'Actual output: <%s>\n' "$output"
          test "$output" = 'No audit findings.'
